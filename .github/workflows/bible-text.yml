# Download the Berean Standard Bible (public domain) USFM and build data/bible/<Book>.json for the app.
name: Bible text
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bible-text
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/bible_text.py 2>&1 | tee bible.log; exit ${PIPESTATUS[0]}
      - if: always()
        run: |
          mkdir -p /tmp/d && cp bible.log /tmp/d/ && cd /tmp/d && git init -q -b diag-bible && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -q -m log
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-bible
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/bible
          git diff --cached --quiet || git commit -q -m "Bible text: Berean Standard Bible (public domain)"
          git pull -q --rebase origin main && git push -q origin HEAD:main
