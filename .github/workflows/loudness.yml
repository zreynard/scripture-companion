# Measure each source's loudness from a sample of episodes; results go to the "diag" branch.
name: Loudness check
on:
  workflow_dispatch:
    inputs:
      n:
        description: "Episodes to sample per source"
        default: "8"
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: pip install -r requirements.txt && python app_build.py
      - run: N=${{ github.event.inputs.n }} python tools/loudness.py | tee loudness.log
      - run: |
          mkdir /tmp/d && cp loudness.json loudness.log /tmp/d/ && cd /tmp/d
          git init -q -b diag && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -q -m loudness
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag
