# Meditate: hear each chosen clip again on its own (tools/med_find.py check) to check its first and last word. By hand only.
name: Meditate check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg >/dev/null
      - run: pip install -q -r requirements.txt faster-whisper numpy
      - run: python app_build.py >/dev/null
      - run: python tools/med_find.py check
