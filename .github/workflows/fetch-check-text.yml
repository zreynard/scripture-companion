# Copy the transcripts from a listening-check run (its artifacts) onto the listen-text branch, so they can be read
# without downloading artifacts.
name: Save listening-check transcripts
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "the listening-check run"
        required: true
permissions:
  contents: write
  actions: read
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: pam_check
          merge-multiple: true
      - run: |
          mkdir out && cd out && git init -q -b listen-text
          cp -r ../pam_check/text . && cp ../pam_check/*.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Transcripts from listening check ${{ inputs.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" listen-text
