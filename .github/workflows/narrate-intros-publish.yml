# Put recorded introductions in the app while the long recording run is still going (hourly, or by hand).
name: Publish recorded introductions
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: narrate-intros-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/narrate_intros.py publish
      - name: Save and republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/narrative_audio.json
          git diff --cached --quiet && exit 0
          git commit -q -m "The Bible Narrative: recorded introductions so far"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done
          gh workflow run refresh.yml -f sources=fearless -f check_links=false
