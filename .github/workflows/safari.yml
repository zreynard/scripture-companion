# The Worship app, presenter, remote and TV in WebKit, the engine of Safari on iPhone and iPad.
name: Safari (WebKit)
on: workflow_dispatch
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i --no-save playwright@1.63.0 >/dev/null && (timeout 240 npx playwright install --with-deps webkit >/dev/null || npx playwright install webkit >/dev/null)
      - name: Pray, every scenario (published site)
        if: always()
        run: BROWSER=webkit SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/pray.js
      - name: Browsers (published site)
        run: BROWSER=webkit SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/ui.js
      - name: Importing a song, all the way through, in every format (published site)
        if: always()
        run: BROWSER=webkit SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/import.js
      - name: Live sync (real relays)
        if: always()
        run: BROWSER=webkit node tools/qa/live.js
      - name: End to end
        if: always()
        run: BROWSER=webkit node tools/worship_e2e.js | tail -6
