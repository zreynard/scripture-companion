# The Worship app, presenter, remote and TV in WebKit, the engine of Safari on iPhone and iPad.
name: Safari (WebKit)
on: workflow_dispatch
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i --no-save playwright@1.63.0 >/dev/null && (timeout 240 npx playwright install --with-deps webkit >/dev/null || npx playwright install webkit >/dev/null)
      - name: Wait until the published page and its version number agree (GitHub's cache can serve the old page for a few minutes after a deploy, and a fresh app reloads itself to the newer one mid-test)
        run: |
          U=https://zreynard.github.io/scripture-companion
          for i in $(seq 1 90); do v=$(curl -s "$U/version.txt?$RANDOM"); p=$(curl -s "$U/index.html?$RANDOM" -H 'Cache-Control: no-cache' | grep -o 'APPV=[0-9]*' | head -1 | cut -d= -f2); a=$(curl -s "$U/" | grep -o 'APPV=[0-9]*' | head -1 | cut -d= -f2)
            echo "version $v, page $p, plain $a"; [ -n "$v" ] && [ "$v" = "$p" ] && [ "$v" = "$a" ] && break; sleep 10; done
      - name: Pray, every scenario (published site)
        if: always()
        run: BROWSER=webkit SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/pray.js
      - name: Browsers (published site)
        run: mkdir -p /tmp/shots && SHOTS=/tmp/shots BROWSER=webkit SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/ui.js
      - name: Importing a song, all the way through, in every format (published site)
        if: always()
        run: BROWSER=webkit SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/import.js
      - name: Worship chart files (File view) on phone, iPad and computer, turned, full screen, Present, offline (published site, Safari's engine)
        if: always()
        run: BROWSER=webkit SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/fileview.js
      - name: Live sync (real relays)
        if: always()
        run: BROWSER=webkit node tools/qa/live.js
      - name: End to end
        if: always()
        run: BROWSER=webkit node tools/worship_e2e.js | tail -6
      - name: Keep the screenshots from the browser tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-shots
          path: /tmp/shots
          if-no-files-found: ignore
          retention-days: 7
