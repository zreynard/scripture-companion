# David Platt's Brook Hills sermons the church's site no longer lists (tools/brookhills_archive.py).
# Saves data/brookhills_archive.json to main; the next refresh puts them on the road.
name: Brook Hills archive
on: workflow_dispatch
permissions:
  contents: write
jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python tools/brookhills_archive.py
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/brookhills_archive.json 2>/dev/null || exit 0
          git diff --cached --quiet || git commit -q -m "Brook Hills archive: David Platt sermons"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done
