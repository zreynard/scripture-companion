# Lengths of recordings whose feeds give none (tools/durations.py), then republish.
name: Recording lengths
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg >/dev/null
      - run: pip install -q -r requirements.txt feedparser && python app_build.py >/dev/null && python tools/durations.py
      - name: Save
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/durations.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Recording lengths"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done
