# Runs on GitHub's servers (which can reach the podcast feeds).
# - Every push: rebuild the app and publish it.
# - Weekly, or by hand from the Actions tab: pull new episodes and publish them right away,
#   then check every link and publish again with the results. The catalog is saved back to the repo.
name: Refresh and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: "Feeds to pull (comma list)"
        default: "ptw,platt_messages,secret_church_podcast,twr360,2819_podcast,mclean,street_preachers,davey_sermons,davey_wfth,davey_journey,brookhills"
      check_links:
        description: "Also open every link (slow)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  SOURCES: ${{ github.event.inputs.sources || 'ptw,platt_messages,secret_church_podcast,twr360,2819_podcast,mclean,street_preachers,davey_sermons,davey_wfth,davey_journey,brookhills' }}
  REFRESH: ${{ github.event_name != 'push' }}
  CHECK: ${{ github.event_name == 'schedule' || github.event.inputs.check_links == 'true' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always build from the newest catalog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt feedparser

      - name: Pull episodes
        if: env.REFRESH == 'true'
        run: |
          python run.py harvest --sources "$SOURCES"
          python run.py stamp
          cat data/harvest_report.json

      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./publish.sh "Publish app"

      - name: Start the link check (its own workflow, so app updates never wait on it)
        if: env.CHECK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check-links.yml --ref main
