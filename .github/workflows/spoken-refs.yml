# Place David Platt sermons whose listing names no passage, by the passage he announces at the start
# (tools/spoken_refs.py), then republish the app. Split over several machines; only sermons not yet heard are done.
name: Spoken passages
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        k: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg >/dev/null
      - run: pip install -q -r requirements.txt feedparser faster-whisper
      - run: timeout 280m python tools/spoken_refs.py ${{ matrix.k }} 8 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spoken-${{ matrix.k }}
          path: data/spoken_refs.${{ matrix.k }}.json
          if-no-files-found: ignore
  save:
    needs: listen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: data
          merge-multiple: true
      - name: Save and republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/spoken_refs.py merge
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/spoken_refs.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Spoken passages for Platt sermons"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done
          gh workflow run refresh.yml -f sources=brookhills_ia -f check_links=false
