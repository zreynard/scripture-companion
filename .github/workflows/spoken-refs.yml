# Place David Platt sermons whose listing names no passage, by the passage he announces at the start
# (tools/spoken_refs.py), then republish the app.
name: Spoken passages
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg >/dev/null
      - run: pip install -q -r requirements.txt feedparser faster-whisper
      - run: python tools/spoken_refs.py
      - name: Save and publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/spoken_refs.json
          git diff --cached --quiet || git commit -q -m "Spoken passages for Platt sermons"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done
          python run.py stamp
          ./publish.sh "Publish app (spoken passages)"
