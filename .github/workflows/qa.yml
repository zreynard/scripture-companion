# Worship QA on GitHub's servers: engine, browsers and live sync on the real relays (tools/qa/*.js), plus the end-to-end run.
name: Worship QA
on: workflow_dispatch   # run by hand only (no schedule: the owner wants no emails)
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i --no-save playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Engine
        run: node tools/qa/engine.js | tail -3
      - name: Old TV browsers can run the TV code (ES5, no newer built-ins)
        if: always()
        run: mkdir -p /tmp/acorn && (cd /tmp/acorn && npm i -q acorn@8.12.1 >/dev/null 2>&1) && NODE_PATH=/tmp/acorn/node_modules node tools/qa/es5.js
      - name: Pray, every scenario (published site)
        if: always()
        run: SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/pray.js
      - name: Browsers (published site)
        run: SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/ui.js
      - name: Sync between devices (fake repo)
        if: always()
        run: SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/sync.js
      - name: Live sync (real relays)
        if: always()
        run: node tools/qa/live.js
      - name: End to end
        if: always()
        run: node tools/worship_e2e.js | tail -4
