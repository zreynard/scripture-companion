# Worship QA on GitHub's servers: engine, browsers and live sync on the real relays (tools/qa/*.js), plus the end-to-end run.
name: Worship QA
on: workflow_dispatch   # run by hand only (no schedule: the owner wants no emails)
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i --no-save playwright@1.63.0 >/dev/null && (timeout 240 npx playwright install --with-deps chromium >/dev/null || npx playwright install chromium >/dev/null)
      - name: Wait until the published page and its version number agree (GitHub's cache can serve the old page for a few minutes after a deploy, and a fresh app reloads itself to the newer one mid-test)
        run: |
          U=https://zreynard.github.io/scripture-companion
          for i in $(seq 1 90); do v=$(curl -s "$U/version.txt?$RANDOM"); p=$(curl -s "$U/index.html?$RANDOM" -H 'Cache-Control: no-cache' | grep -o 'APPV=[0-9]*' | head -1 | cut -d= -f2); a=$(curl -s "$U/" | grep -o 'APPV=[0-9]*' | head -1 | cut -d= -f2)
            echo "version $v, page $p, plain $a"; [ -n "$v" ] && [ "$v" = "$p" ] && [ "$v" = "$a" ] && break; sleep 10; done
      - name: Engine
        run: node tools/qa/engine.js | tail -3
      - name: Chord charts in every format, and 20,000 generated charts
        if: always()
        run: N=20000 node tools/qa/charts.js | tail -4
      - name: Importing a song, all the way through, in every format (published site)
        if: always()
        run: SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/import.js
      - name: Old TV browsers can run the TV code (ES5, no newer built-ins)
        if: always()
        run: mkdir -p /tmp/acorn && (cd /tmp/acorn && npm i -q acorn@8.12.1 >/dev/null 2>&1) && NODE_PATH=/tmp/acorn/node_modules node tools/qa/es5.js
      - name: How fast the app opens (published site)
        if: always()
        run: SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/perf.js
      - name: Pray, every scenario (published site)
        if: always()
        run: SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/pray.js
      - name: Browsers (published site)
        if: always()
        run: SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/ui.js
      - name: Worship chart files (File view) on phone, iPad and computer, turned, full screen, Present, offline (published site)
        if: always()
        run: SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/fileview.js
      - name: Sync between devices (fake repo)
        if: always()
        run: SITE=https://zreynard.github.io/scripture-companion/ node tools/qa/sync.js
      - name: Live sync (real relays)
        if: always()
        run: node tools/qa/live.js
      - name: End to end
        if: always()
        run: node tools/worship_e2e.js | tail -4
