# Diagnostics: how GitHub serves a narration file to a browser (type, ranges, cross-site access).
name: Asset headers
on: workflow_dispatch
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://github.com/${{ github.repository }}/releases/download/narration-ot/Gen_001.mp3
          O="Origin: https://zreynard.github.io"
          echo "== first hop"; curl -sSI -H "$O" "$U" | grep -viE "^(content-security|set-cookie|strict|x-frame|referrer|permissions)"
          echo "== final, range"; curl -sSL -D- -o /dev/null -r 0-99 -H "$O" "$U" | grep -iE "^HTTP|content-type|content-range|access-control|disposition|location" | sed 's/?.*//'
          echo "== preflight"; curl -sSI -X OPTIONS -H "$O" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: range" "$U" | grep -iE "^HTTP|access-control"
          echo "== raw"; curl -sSI -H "$O" https://raw.githubusercontent.com/${{ github.repository }}/main/README.md | grep -iE "^HTTP|content-type|access-control"
