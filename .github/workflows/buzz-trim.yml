# Start and end points for Buzzsprout recordings from the transcripts their feeds publish (tools/buzz_trim.py).
# The words around every cut go to the "trim-buzz" branch to read; merge=1 also saves the points.
name: Buzzsprout trims
on:
  schedule:
    - cron: "47 10 * * *"      # daily: new episodes only, saved (never fails, so it never emails)
  workflow_dispatch:
    inputs:
      all:
        description: "1 = measure again those already measured"
        default: "1"
      sources:
        description: "only these sources (comma list)"
        default: ""
      ids:
        description: "only these recordings (comma list)"
        default: ""
      merge:
        description: "1 = save the points to data/intro_skip"
        default: "0"
      debug:
        description: "1 = print each recording's last transcript words"
        default: "0"
permissions:
  contents: write
  actions: write
concurrency:
  group: buzz-trim
  cancel-in-progress: false
jobs:
  buzz:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python app_build.py >/dev/null
      - run: DEBUG="${{ inputs.debug }}" ALL="${{ inputs.all }}" SRCS="${{ inputs.sources }}" IDS="${{ inputs.ids }}" python tools/buzz_trim.py measure || true
      - run: python tools/trim_audit.py report || true
      - run: |
          [ -f trim/buzz.json ] || exit 0
          mkdir /tmp/d && cp audit/* trim/buzz.json /tmp/d/ && cd /tmp/d
          git init -q -b trim-buzz && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -q -m "buzzsprout trims"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" trim-buzz
      - if: ${{ inputs.merge == '1' || github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python app_build.py >/dev/null && python tools/trim.py merge
            git add data/intro_skip/
            git diff --cached --quiet && exit 0
            git commit -q -m "Buzzsprout trim points (from published transcripts)"
            git push -q origin HEAD:main && break
            sleep $((i*7))
          done
          gh workflow run refresh.yml -f sources=fearless -f check_links=false
