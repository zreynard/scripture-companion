# Check that GitHub's contents API takes and returns the 12 MB parts the prayer-music backup uses (on a throwaway branch).
name: Music backup size test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          SHA=$(gh api repos/$R/git/ref/heads/main --jq .object.sha)
          gh api -X POST repos/$R/git/refs -f ref=refs/heads/diag-mbtest -f sha=$SHA --jq .ref
          head -c 12582912 /dev/urandom > part.bin
          python3 -c "import base64,json;print(json.dumps({'message':'size test','branch':'diag-mbtest','content':base64.b64encode(open('part.bin','rb').read()).decode()}))" > part.json
          ls -l part.json
          time gh api -X PUT repos/$R/contents/mbtest/part0 --input part.json --jq '"stored " + (.content.size|tostring)'
          curl -sS -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/$R/contents/mbtest/part0?ref=diag-mbtest" -o back.bin -D h.txt
          grep -i "^content-type\|^access-control-allow-origin\|^content-length" h.txt || true
          cmp part.bin back.bin && echo "RAW DOWNLOAD MATCHES"
          curl -sSI -X OPTIONS "https://api.github.com/repos/$R/contents/x" -H "Origin: https://zreynard.github.io" -H "Access-Control-Request-Method: PUT" -H "Access-Control-Request-Headers: authorization,content-type,accept" | grep -i "access-control" || true
          gh api -X DELETE repos/$R/git/refs/heads/diag-mbtest && echo "branch removed"
