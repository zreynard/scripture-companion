<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f4efe3"><title>Worship · Live</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4efe3;--ink:#1b2440;--mute:#6b7390;--line:rgba(27,36,64,.12);--gold:#c9a24a;--gold2:#a8812a;--navy:#121a2e;--warm:#f6efe0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(118px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.top{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.back{border:0;background:none;color:var(--gold2);font-weight:600;font-size:15px;padding:8px 4px;text-decoration:none;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:16px;background:rgba(27,36,64,.06);font-size:13px;font-weight:600;color:var(--ink);border:0;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:#b8b2a2;flex:none}.pill.ok i{background:#3f9b6a}.pill.warn i{background:#d08a2e}.pill.bad i{background:#c4553a}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:20px;border:0;background:rgba(27,36,64,.06);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.song{display:flex;align-items:center;gap:10px;margin:6px 14px 10px;padding:12px 14px;border-radius:16px;background:#fffdf8;box-shadow:0 3px 12px rgba(27,36,64,.06);border:0;width:calc(100% - 28px);text-align:left}
.song b{display:block;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song small{display:block;font-size:13px;color:var(--mute)}
.song .k{margin-left:auto;font:700 13px ui-monospace,Menlo,monospace;color:var(--gold2);background:rgba(201,162,74,.14);padding:4px 9px;border-radius:10px;flex:none}
.seg{display:flex;background:rgba(27,36,64,.07);border-radius:20px;padding:3px;margin:0 14px 12px}
.seg button{flex:1;height:34px;border:0;border-radius:17px;background:none;font-weight:600;font-size:14px;color:#4a5272}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(27,36,64,.14)}
.mon{margin:0 14px;border-radius:16px;background:radial-gradient(120% 90% at 50% 40%,#16213a,#0f1628 70%);color:var(--warm);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;text-align:center;padding:4% 6%;position:relative;overflow:hidden}
.mon .tx{font-size:clamp(13px,4.2vw,26px);line-height:1.3}.mon .tx .gap{height:.5em}
.mon .lab{position:absolute;left:10px;top:8px;font:700 10px -apple-system,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,239,224,.5)}
.mon.blank .tx{opacity:.12}.mon.blank::after{content:'Screen blank';position:absolute;inset:auto 0 10px;font:600 12px -apple-system,system-ui,sans-serif;color:rgba(246,239,224,.7)}
.next{margin:10px 14px 0;padding:10px 12px;border-radius:12px;background:rgba(27,36,64,.05);font-size:14px;color:var(--mute);display:flex;gap:8px}
.next b{color:var(--ink);font-weight:650;white-space:nowrap}.next span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:48px;height:44px;padding:0 14px;border-radius:22px;border:1px solid rgba(27,36,64,.16);background:#fff;font-weight:650;font-size:15px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chart{padding:4px 18px 10px}
.wc-s{margin:0 0 16px;padding:8px 10px;border-radius:12px;transition:background .25s}.wc-s.on{background:rgba(201,162,74,.16)}
.wc-h{margin:0 0 6px;font:700 11.5px -apple-system,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7a5c16}.wc-h i{font-style:normal;color:var(--mute);letter-spacing:0;text-transform:none;font-weight:600}
.wc-l{display:flex;flex-wrap:wrap;align-items:flex-end;font-size:17px;line-height:1.25;margin:0 0 6px}.wc-w{display:inline-flex;flex-direction:column;white-space:pre}
.wc-c{font:700 14px/1.2 ui-monospace,Menlo,monospace;color:#a8812a;min-height:1.2em;padding-right:4px}.wc-t{white-space:pre}.wc-only .wc-t{display:none}.wc-gap{height:10px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(250,246,236,.96);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:5}
.bar button{height:64px;border-radius:20px;border:0;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.b-blank{width:84px;background:rgba(27,36,64,.07)}.b-blank.on{background:#c4553a;color:#fff}
.b-prev{width:84px;background:rgba(27,36,64,.07)}.b-next{flex:1;background:var(--ink);color:#fff;font-size:18px}
.wait{padding:60px 28px;text-align:center;color:var(--mute)}.wait h2{color:var(--ink);font-weight:400;font-size:26px;margin:0 0 10px}
.sheet{position:fixed;inset:0;background:rgba(15,22,40,.38);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
.sh h3{margin:2px 0 6px;font-size:22px;font-weight:400}.sh p{margin:6px 0 12px;color:var(--mute);font-size:14.5px;line-height:1.45}.sh p b{color:var(--ink)}
.sh .row{display:flex;gap:10px;margin:10px 0}
.btn{height:48px;padding:0 18px;border-radius:24px;border:1px solid rgba(27,36,64,.16);background:#fff;font-weight:650;font-size:15px}.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.wide{width:100%}
.code-in{width:100%;height:64px;border-radius:16px;border:1px solid rgba(27,36,64,.2);background:#fff;text-align:center;font:700 32px ui-monospace,Menlo,monospace;letter-spacing:.3em;text-transform:uppercase;color:var(--ink)}
.url{font:600 14px ui-monospace,Menlo,monospace;background:#fff;border-radius:12px;padding:10px 12px;word-break:break-all;border:1px solid var(--line)}
.qr{display:flex;justify-content:center;margin:8px 0 4px}.qr img,.qr svg{width:210px;height:210px;image-rendering:pixelated;background:#fff;padding:10px;border-radius:14px}
.list button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border:0;background:none;border-bottom:1px solid var(--line);text-align:left}
.list .n{width:26px;height:26px;border-radius:13px;background:rgba(27,36,64,.07);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.list .on .n{background:var(--ink);color:#fff}.list b{font-weight:600}.list small{display:block;color:var(--mute);font-size:13px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:18px;font-size:14px;font-weight:600;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none}
.keys{display:none}
@media (min-width:900px){
 body{padding-bottom:110px}.wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;padding:0 10px}
 .mon .tx{font-size:clamp(16px,1.9vw,30px)}.seg{display:none}.chart{display:block!important;max-height:calc(100vh - 230px);overflow:auto}
 .keys{display:block;margin:14px 14px 0;font-size:13px;color:var(--mute)}.keys kbd{font:600 12px ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink)}
 .bar{justify-content:center}.bar button{max-width:220px}.b-next{flex:0 1 320px}
}
</style></head>
<body>
<div class="top"><a class="back" id="back" hidden>‹ Worship</a><button class="pill" id="pill"><i></i><span>Connecting…</span></button><span class="sp"></span>
<button class="ib" id="bScreen" aria-label="Connect a screen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
<button class="ib" id="bShare" aria-label="Share the remote"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
<button class="ib" id="bEnd" aria-label="End" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div id="app"><div class="wait"><h2 class="serif">Joining…</h2><p>Getting the songs for this worship time.</p></div></div>
<div class="bar" id="bar" hidden><button class="b-blank" id="bBlank">Blank</button><button class="b-prev" id="bPrev" aria-label="Back"><svg width="22" height="22" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="b-next" id="bNext">Next <svg width="20" height="20" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
<div class="sheet" id="sh" hidden><div class="sh" id="shb"></div></div>
<div class="toast" id="toast"></div>
<script src="../live.js"></script><script src="../worship.js"></script><script src="../qrcode.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); }, esc = Worship.esc;
  function hp() { var o = {}; location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) o[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); }); return o; }
  var H = hp(), lead = H.lead === '1', sess = null, deck = null, state = null, view = 'lyrics', st = { relays: 0, screens: 0 }, gotFirst = false, base = location.href.replace(/live\/.*$/, '');
  try { view = localStorage.getItem('scwp:view') || (lead ? 'chords' : 'lyrics'); } catch (e) {}
  if (!H.s || !H.k) { $('#app').innerHTML = '<div class="wait"><h2 class="serif">No worship time here</h2><p>Open this from Worship in the app, or from the link someone shared.</p></div>'; return; }
  if (!window.crypto || !crypto.subtle || !window.WebSocket) { $('#app').innerHTML = '<div class="wait"><h2 class="serif">This browser is too old</h2><p>Open the link in Safari or Chrome.</p></div>'; return; }
  function toast(t) { var e = $('#toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.opacity = 0; }, 2200); }
  function screenURL() { return base + 'tv/#s=' + H.s + '&k=' + H.k; }
  function remoteURL() { return base + 'live/#s=' + H.s + '&k=' + H.k; }
  if (lead) { $('#back').hidden = false; $('#back').href = base + '#worship'; $('#bEnd').hidden = false; }
  var saved = null; if (lead) try { var w = JSON.parse(localStorage.getItem('sc:wlive') || 'null'); if (w && w.sid === H.s) saved = w; } catch (e) {}
  sess = new Live.Session({ sid: H.s, key: H.k, role: lead ? 'lead' : 'remote',
    onState: function (s) { state = s; if (s.ended && !lead) return ended(); paint(); },
    onDeck: function (d) { deck = d; paint(true); },
    onStatus: function (x) {
      var was = st.relays; st = x; pill();
      if (lead && saved && x.relays > was) sess.send('d', deck, true);   // put the songs back on the relay after any reconnect
    } });
  if (lead && saved) { deck = saved.deck; sess.deck = deck; sess.send('d', deck, true); paint(true);   /* the songs are already here: show them now */
    setTimeout(function () { if (!sess.state) sess.set({ song: 0, slide: 0, blank: false }); }, 2500); }
  setTimeout(function () { if (!deck) $('#app').innerHTML = '<div class="wait"><h2 class="serif">Waiting for the songs…</h2><p>If this stays, the worship time may have ended, or this network blocks the live service. Try another Wi‑Fi or your phone’s data.</p></div>'; }, 9000);
  function pill() {
    var p = $('#pill'), t, c;
    if (!st.relays) { t = 'Reconnecting…'; c = 'bad'; } else if (st.screens) { t = st.screens > 1 ? st.screens + ' screens connected' : 'Screen connected'; c = 'ok'; } else { t = 'No screen yet'; c = 'warn'; }
    p.className = 'pill ' + c; p.querySelector('span').textContent = t;
  }
  setInterval(pill, 3000);
  function ended() { $('#bar').hidden = true; $('#app').innerHTML = '<div class="wait"><h2 class="serif">This worship time has ended</h2><p>Thanks for helping lead.</p></div>'; sess.close(); }
  function cur() { var s = state || { song: 0, slide: 0 }; var sg = deck && deck.songs[s.song || 0]; return { s: s, sg: sg, sl: sg && sg.slides[s.slide || 0] }; }
  function nextOf(s) { var sg = deck.songs[s.song], i = s.slide + 1; if (i < sg.slides.length) return { song: s.song, slide: i, sg: sg }; if (s.song + 1 < deck.songs.length) return { song: s.song + 1, slide: 0, sg: deck.songs[s.song + 1] }; return null; }
  function linesHTML(l) { return l.length ? l.map(function (x) { return x ? '<div>' + esc(x) + '</div>' : '<div class="gap"></div>'; }).join('') : '<div style="opacity:.55;font-size:.7em">(no words: instrumental)</div>'; }
  function paint(full) {
    if (!deck) return; $('#bar').hidden = false;
    var c = cur(); if (!c.sg) return;
    var s = { song: c.s.song || 0, slide: c.s.slide || 0 }, nx = nextOf(s), secs = [], seen = {};
    c.sg.slides.forEach(function (x) { if (!seen[x.sec]) { seen[x.sec] = 1; secs.push({ sec: x.sec, label: x.s.replace(/ \(\d+\/\d+\)$/, ''), short: c.sg.short[x.sec] }); } });
    var h = '<button class="song" id="bSongs"><span style="min-width:0"><small>Song ' + (s.song + 1) + ' of ' + deck.songs.length + (deck.name ? ' · ' + esc(deck.name) : '') + '</small><b class="serif">' + esc(c.sg.t) + '</b></span>' + (c.sg.key ? '<span class="k">' + esc(c.sg.key) + (c.sg.capo ? ' · capo ' + c.sg.capo : '') + '</span>' : '') + '</button>';
    h += '<div class="seg"><button data-v="lyrics" class="' + (view === 'lyrics' ? 'on' : '') + '">Lyrics</button><button data-v="chords" class="' + (view === 'chords' ? 'on' : '') + '">Chords</button></div>';
    h += '<div class="wrap"><div class="col1"' + (view === 'chords' ? ' data-phone-hide' : '') + '>';
    h += '<div class="mon' + (c.s.blank ? ' blank' : '') + '"><span class="lab">' + esc(c.sl ? c.sl.s : '') + '</span><div class="tx serif">' + (c.sl ? linesHTML(c.sl.l) : '') + '</div></div>';
    h += nx ? '<div class="next"><b>Next' + (nx.song !== s.song ? ' song' : '') + ':</b><span>' + esc(nx.song !== s.song ? nx.sg.t : nx.sg.slides[nx.slide].s) + (nx.sg.slides[nx.slide].l[0] ? ' — ' + esc(nx.sg.slides[nx.slide].l[0]) : '') + '</span></div>' : '<div class="next"><b>End</b><span>This is the last slide</span></div>';
    h += '<div class="keys"><kbd>→</kbd> next · <kbd>←</kbd> back · <kbd>B</kbd> blank · <kbd>1</kbd>–<kbd>9</kbd> section · <kbd>[</kbd> <kbd>]</kbd> song</div></div>';
    h += '<div class="col2"><div class="chips">' + secs.map(function (x, i) { return '<button class="chip' + (c.sl && c.sl.sec === x.sec ? ' on' : '') + '" data-sec="' + x.sec + '" title="' + esc(x.label) + '">' + esc(x.label.length <= 9 ? x.label : x.short) + '</button>'; }).join('') + '</div>';
    h += '<div class="chart" id="chart"' + (view === 'chords' ? '' : ' style="display:none"') + '>' + (c.sg.chart || '') + '</div></div></div>';
    $('#app').innerHTML = h;
    if (view === 'chords' && innerWidth < 900) { var c1 = document.querySelector('.col1 .mon'); if (c1) c1.style.display = 'none'; }
    var on = c.sl ? document.querySelector('#chart [data-sec="' + c.sl.sec + '"]') : null;
    document.querySelectorAll('#chart .wc-s').forEach(function (e) { e.classList.toggle('on', e === on); });
    if (on) { var ch = $('#chart'); if (innerWidth >= 900) ch.scrollTo({ top: on.offsetTop - ch.offsetTop - 20, behavior: full ? 'auto' : 'smooth' }); else on.scrollIntoView({ block: 'center', behavior: full ? 'auto' : 'smooth' }); }
    var chip = document.querySelector('.chip.on'); if (chip) chip.scrollIntoView({ inline: 'center', block: 'nearest' });
    $('#bBlank').classList.toggle('on', !!c.s.blank); $('#bBlank').textContent = c.s.blank ? 'Show' : 'Blank';
    $('#bSongs').onclick = songsSheet;
    document.querySelectorAll('.seg [data-v]').forEach(function (b) { b.onclick = function () { view = b.dataset.v; try { localStorage.setItem('scwp:view', view); } catch (e) {} paint(true); }; });
    document.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { jump(+b.dataset.sec); }; });
  }
  /* the next time this section comes in the song (after where we are); the first one if it does not come again */
  function jump(sec) {
    var c = cur(); if (!c.sg) return; var at = c.s.slide || 0, i, idx = -1;
    var curOcc = c.sl ? c.sl.occ : -1;
    for (i = 0; i < c.sg.slides.length; i++) { var x = c.sg.slides[i]; if (x.sec === sec && !x.part && x.occ > curOcc) { idx = i; break; } }
    if (idx < 0) for (i = 0; i < c.sg.slides.length; i++) if (c.sg.slides[i].sec === sec && !c.sg.slides[i].part) { idx = i; break; }
    if (idx >= 0) sess.set({ slide: idx, blank: false });
  }
  function go(d) {
    if (!deck) return; var c = cur(), s = c.s.song || 0, i = (c.s.slide || 0) + d;
    if (i >= c.sg.slides.length) { if (s + 1 < deck.songs.length) { s++; i = 0; } else return toast('End of the set'); }
    if (i < 0) { if (s > 0) { s--; i = deck.songs[s].slides.length - 1; } else return; }
    sess.set({ song: s, slide: i, blank: false });
  }
  function song(d) { var s = ((state && state.song) || 0) + d; if (deck && s >= 0 && s < deck.songs.length) sess.set({ song: s, slide: 0, blank: false }); }
  $('#bNext').onclick = function () { go(1); }; $('#bPrev').onclick = function () { go(-1); };
  $('#bBlank').onclick = function () { sess.set({ blank: !(state && state.blank) }); };
  function sheet(html) { $('#shb').innerHTML = html; $('#sh').hidden = false; }
  $('#sh').onclick = function (e) { if (e.target.id === 'sh' || e.target.closest('[data-close]')) $('#sh').hidden = true; };
  function songsSheet() {
    var cs = (state && state.song) || 0;
    sheet('<h3 class="serif">' + esc(deck.name || 'Songs') + '</h3><div class="list">' + deck.songs.map(function (s, i) { return '<button data-song="' + i + '" class="' + (i === cs ? 'on' : '') + '"><span class="n">' + (i + 1) + '</span><span><b>' + esc(s.t) + '</b><small>' + esc([s.a, s.key].filter(Boolean).join(' · ')) + '</small></span></button>'; }).join('') + '</div><div class="row"><button class="btn wide" data-close>Close</button></div>');
    document.querySelectorAll('[data-song]').forEach(function (b) { b.onclick = function () { sess.set({ song: +b.dataset.song, slide: 0, blank: false }); $('#sh').hidden = true; }; });
  }
  $('#bScreen').onclick = function () {
    var wide = innerWidth >= 900;
    sheet('<h3 class="serif">Connect a screen</h3><p>On the TV or laptop, open <b>' + esc(base.replace(/^https?:\/\//, '')) + 'tv</b>. It shows a code: type it here.</p>' +
      '<input class="code-in" id="cin" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="······"><div class="row"><button class="btn pri wide" id="cgo">Connect</button></div><p id="cmsg"></p>' +
      '<p style="margin-top:18px">Or open this link on the laptop or TV:</p><div class="url">' + esc(screenURL()) + '</div><div class="row"><button class="btn" id="ccopy">Copy link</button>' + (wide ? '<button class="btn pri" id="caud">Open audience window here</button>' : '') + '</div>' +
      (wide ? '<p>Drag the audience window onto the TV, then press <b>F</b> for full screen. This window stays your presenter view.</p>' : '') + '<div class="row"><button class="btn wide" data-close>Done</button></div>');
    $('#cin').focus();
    $('#cgo').onclick = function () {
      var c = $('#cin').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (c.length !== 6) { $('#cmsg').textContent = 'The code has 6 letters and numbers.'; return; }
      $('#cmsg').textContent = 'Connecting…';
      Live.sendPair(c, { sid: H.s, key: H.k }).then(function (n) {
        if (!n) { $('#cmsg').textContent = 'Could not reach the live service. Check your connection and try again.'; return; }
        $('#cmsg').textContent = 'Sent. The screen should show the lyrics in a moment.';
        var t0 = Date.now(), iv = setInterval(function () { if (sess.screens() > 0) { clearInterval(iv); $('#sh').hidden = true; toast('Screen connected'); } else if (Date.now() - t0 > 12000) { clearInterval(iv); $('#cmsg').textContent = 'No screen answered. Check the code on the TV and try again.'; } }, 500);
      });
    };
    $('#cin').onkeydown = function (e) { if (e.key === 'Enter') $('#cgo').onclick(); };
    $('#ccopy').onclick = function () { copy(screenURL()); };
    if ($('#caud')) $('#caud').onclick = function () { window.open(screenURL(), 'scwp-audience', 'popup,width=1280,height=720'); $('#sh').hidden = true; };
  };
