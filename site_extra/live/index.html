 .bar{justify-content:center}.bar button{max-width:220px}.b-next{flex:0 1 320px}

<body>
<div class="top"><a class="back" id="back" hidden>‹ Worship</a><button class="pill" id="pill"><i></i><span>Connecting…</span></button><span class="sp"></span>
<button class="ib" id="bScreen" aria-label="Connect a screen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
<button class="ib" id="bShare" aria-label="Share the remote"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
<button class="ib" id="bEnd" aria-label="End" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div id="tvw" hidden></div><div id="app"><div class="wait"><h2 class="serif">Joining…</h2><p>Getting the songs for this worship time.</p></div></div>
<div class="bar" id="bar" hidden><button class="b-blank" id="bBlank">Blank</button><button class="b-prev" id="bPrev" aria-label="Back"><svg width="20" height="20" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button><button class="b-next" id="bNext">Next <svg width="20" height="20" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
<div class="sheet" id="sh" hidden><div class="sh" id="shb"></div></div>
<div class="toast" id="toast"></div>
<script src="../live.js"></script><script src="../worship.js"></script><script src="../qrcode.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); }, esc = Worship.esc;
  function hp() { var o = {}; location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) { var v = kv.slice(i + 1); try { v = decodeURIComponent(v); } catch (e) {} o[kv.slice(0, i)] = v; } }); return o; }
  var H = hp(), lead = H.lead === '1', sess = null, deck = null, state = null, view = 'lyrics', st = { relays: 0, screens: 0 }, gotFirst = false, base = location.href.replace(/live\/.*$/, '');
  try { view = localStorage.getItem('scwp:view') || (lead ? 'chords' : 'lyrics'); } catch (e) {}
  if (!H.s || !H.k) { $('#app').innerHTML = '<div class="wait"><h2 class="serif">No worship time here</h2><p>Open this from Worship in the app, or from the link someone shared.</p></div>'; return; }
  if (!window.crypto || !crypto.subtle || !window.WebSocket) { $('#app').innerHTML = '<div class="wait"><h2 class="serif">This browser is too old</h2><p>Open the link in Safari or Chrome.</p></div>'; return; }
  function toast(t) { var e = $('#toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.opacity = 0; }, 2200); }

  if (lead) { $('#back').hidden = false; $('#back').href = base + '#worship'; $('#bEnd').hidden = false; }
  var saved = null; if (lead) try { var w = JSON.parse(localStorage.getItem('sc:wlive') || 'null'); if (w && w.sid === H.s) saved = w; } catch (e) {}

    onState: function (s, via) { var was = state; state = s; if (s.ended && !lead) return ended(); told(was, s, via); paint(); },
    onDeck: function (d) { deck = d; paint(true); },

      var was = st.relays; st = x; pill();

    } }); } catch (e) { $('#app').innerHTML = '<div class="wait"><h2 class="serif">This link is broken</h2><p>Ask for the link again, or open Worship in the app.</p></div>'; return; }

    setTimeout(function () { if (!sess.state) sess.set({ song: 0, slide: 0, blank: false }); }, 2500); }

    var p = $('#pill'), t, c;

  function cur() { var s = state || { song: 0, slide: 0 }; var sg = deck && deck.songs[s.song || 0]; return { s: s, sg: sg, sl: sg && sg.slides[s.slide || 0] }; }

    if (side) h += chipsH;
    h += '<div class="keys"><kbd>→</kbd> next · <kbd>←</kbd> back · <kbd>B</kbd> blank · <kbd>1</kbd>–<kbd>9</kbd> section · <kbd>[</kbd> <kbd>]</kbd> song</div></div>';
    h += '<div class="col2">' + (side ? '' : chipsH);
    h += '<div class="chart wfit" id="chart"' + (view === 'chords' || innerWidth >= 900 ? '' : ' style="display:none"') + '><div class="wc">' + chartOf(c.sg) + '</div><span class="wfit-pg" id="cpg" hidden></span></div></div></div>';
    $('#app').innerHTML = h;
    if (view === 'chords' && innerWidth < 900 && !(innerWidth > innerHeight && innerHeight <= 520)) { var c1 = document.querySelector('.col1 .mon'); if (c1) c1.style.display = 'none'; }
    var on = c.sl ? document.querySelector('#chart [data-sec="' + c.sl.sec + '"]') : null;
    document.querySelectorAll('#chart .wc-s').forEach(function (e) { e.classList.toggle('on', e === on); });
    fitChart(on, c.s.song);
    var chip = document.querySelector('.chip.on'); if (chip) chip.scrollIntoView({ inline: 'center', block: 'nearest' });
    $('#bar').classList.toggle('locked', !lead && !!(state && state.lock));
    $('#bBlank').classList.toggle('on', !!c.s.blank); $('#bBlank').textContent = c.s.blank ? 'Show' : 'Blank';
    $('#bSongs').onclick = songsSheet;
    document.querySelectorAll('.seg [data-v]').forEach(function (b) { b.onclick = function () { view = b.dataset.v; try { localStorage.setItem('scwp:view', view); } catch (e) {} paint(true); }; });
    document.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { jump(+b.dataset.sec); }; });
    var mon = document.querySelector('.mon'); if (mon) { Worship.swipe(mon, function (d) { go(d); });
      /* tap the lyrics: forward; tap the left third: back */
      mon.onclick = function (e) { if (mon._swiped && Date.now() - mon._swiped < 400) return; var r = mon.getBoundingClientRect(); go(e.clientX - r.left < r.width / 3 ? -1 : 1); tapped(); mon.classList.add('flash'); setTimeout(function () { mon.classList.remove('flash'); }, 160); }; }
  }
  /* the chord chart fits its space (no scrolling while playing); a long one turns to the page holding the current section */
  var fitFor = null;
  function fitChart(on, song) {
    var box = $('#chart'); if (!box || getComputedStyle(box).display === 'none') return;
    var top = box.getBoundingClientRect().top + scrollY, pad = parseFloat(getComputedStyle(document.body).paddingBottom) || 0, bar = ($('#bar') || {}).offsetHeight || 0;
    box.style.height = Math.max(110, innerHeight - top - Math.max(pad, bar) - 6) + 'px';
    var key = song + ':' + innerWidth + 'x' + innerHeight;
    if (fitFor !== key || !box._fit) { box._fit = Worship.fit(box); fitFor = key; }
    var info = box._fit, pg = Worship.pageOf(box, on, info); Worship.turn(box, pg, info); box._pg = pg;
    var lab = $('#cpg'); if (lab) { lab.hidden = info.pages < 2; lab.textContent = (pg + 1) + ' / ' + info.pages; }
    if (!box._sw) { box._sw = 1; Worship.swipe(box, function (d) { var i = box._fit; if (!i || i.pages < 2) return; box._pg = Math.max(0, Math.min(i.pages - 1, box._pg + d)); Worship.turn(box, box._pg, i); if (lab) lab.textContent = (box._pg + 1) + ' / ' + i.pages; }); }
    box.onclick = function (e) { if (box._swiped && Date.now() - box._swiped < 400) return; var i = box._fit; if (!i || i.pages < 2) return; var r = box.getBoundingClientRect(); box._pg = Math.max(0, Math.min(i.pages - 1, box._pg + (e.clientX - r.left > r.width / 2 ? 1 : -1))); Worship.turn(box, box._pg, i); if (lab) lab.textContent = (box._pg + 1) + ' / ' + i.pages; };
  }
  function refit() { clearTimeout(fitChart.t); fitChart.t = setTimeout(function () { fitFor = null; paint(true); }, 150); }
  /* Safari does not always send 'resize' when an iPad turns: watch the turn and the page's own size as well */
  addEventListener('resize', refit); addEventListener('orientationchange', function () { setTimeout(refit, 250); });
  if (window.visualViewport) visualViewport.addEventListener('resize', refit);
  if (window.ResizeObserver) { var lw = 0, lh = 0; new ResizeObserver(function () { if (innerWidth === lw && innerHeight === lh) return; lw = innerWidth; lh = innerHeight; refit(); }).observe(document.documentElement); }
  /* the next time this section comes in the song (after where we are); the first one if it does not come again */
  function jump(sec) {
    var c = cur(); if (!c.sg) return; var at = c.s.slide || 0, i, idx = -1;
    var curOcc = c.sl ? c.sl.occ : -1;
    for (i = 0; i < c.sg.slides.length; i++) { var x = c.sg.slides[i]; if (x.sec === sec && !x.part && x.occ > curOcc) { idx = i; break; } }
    if (idx < 0) for (i = 0; i < c.sg.slides.length; i++) if (c.sg.slides[i].sec === sec && !c.sg.slides[i].part) { idx = i; break; }
    if (idx >= 0) ctl({ slide: idx, blank: false });
  }
  function go(d) {
    if (!deck) return; var n = Live.step(deck, state || { song: 0, slide: 0 }, d);
    if (!n) return d > 0 ? toast('End of the set · tap the song name to pick another') : null;
    ctl(n);
  }
  function song(d) { var n = deck && Live.songStep(deck, state || { song: 0 }, d); if (n) ctl(n); }
  $('#bNext').onclick = function () { go(1); }; $('#bPrev').onclick = function () { go(-1); };
  $('#bBlank').onclick = function () { ctl({ blank: !(state && state.blank) }); };
  function sheet(html) { $('#shb').innerHTML = html; $('#sh').hidden = false; }
  $('#sh').onclick = function (e) { if (e.target.id === 'sh' || e.target.closest('[data-close]')) $('#sh').hidden = true; };
  /* all songs: this set first, then the whole songbook, with search. Picking one puts it on the screen. */
  function songsSheet() {
    var cs = (state && state.song) || 0, set = Live.setOf(deck), q = '';
    var norm = function (x) { return String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); };
    var row = function (i, n) { var s = deck.songs[i]; return '<button data-song="' + i + '" class="' + (i === cs ? 'on' : '') + '"><span class="n">' + n + '</span><span><b>' + esc(s.t) + '</b><small>' + esc([s.a, s.key].filter(Boolean).join(' · ')) + '</small></span></button>'; };
    function list() {
      var w = norm(q).split(' ').filter(Boolean), hit = function (i) { var s = deck.songs[i], t = norm(s.t + ' ' + (s.a || '')); return w.every(function (x) { return t.indexOf(x) >= 0; }); };
      var inSet = set.filter(hit), rest = deck.songs.map(function (x, i) { return i; }).filter(function (i) { return set.indexOf(i) < 0 && hit(i); });
      var h = (inSet.length ? (rest.length || set.length < deck.songs.length ? '<div class="lh">' + esc(deck.name || 'This set') + '</div>' : '') + inSet.map(function (i) { return row(i, set.indexOf(i) + 1); }).join('') : '') +
        (rest.length ? '<div class="lh">Songbook</div>' + rest.map(function (i) { return row(i, '♪'); }).join('') : '') + (!inSet.length && !rest.length ? '<p class="who">No song matches “' + esc(q) + '”.</p>' : '');
      $('#slist').innerHTML = h;
      document.querySelectorAll('#slist [data-song]').forEach(function (b) { b.onclick = function () {
        var i = +b.dataset.song, p = set.indexOf(cs), inS = set.indexOf(i) >= 0;
        ctl({ song: i, slide: 0, blank: false, ret: inS ? null : (p >= 0 ? p : (state && state.ret != null ? state.ret : null)) }); $('#sh').hidden = true;
      }; });
    }
    sheet('<h3 class="serif">Songs</h3>' + (deck.songs.length > 6 ? '<input class="srch" id="sq" type="search" placeholder="Search ' + deck.songs.length + ' songs" autocomplete="off">' : '') + '<div class="list" id="slist"></div><div class="row"><button class="btn wide" data-close>Close</button></div>');
    list(); var sq = $('#sq'); if (sq) sq.oninput = function () { q = sq.value; list(); };
  }
  $('#bScreen').onclick = function () {
    var wide = innerWidth >= 900;
    sheet('<h3 class="serif">Connect a screen</h3><p>On the TV or laptop, open <b>' + esc(base.replace(/^https?:\/\//, '')) + 'tv</b>. It shows a code: type it here.</p>' +
      '<input class="code-in" id="cin" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="······"><div class="row"><button class="btn pri wide" id="cgo">Connect</button></div><p id="cmsg"></p>' +
      '<p style="margin-top:18px">Or open this link on the laptop or TV:</p><div class="url">' + esc(screenURL()) + '</div><div class="row"><button class="btn" id="ccopy">Copy link</button>' + (wide ? '<button class="btn pri" id="caud">Open audience window here</button>' : '') + '</div>' +
      (wide ? '<p>Drag the audience window onto the TV, then press <b>F</b> for full screen. This window stays your presenter view.</p>' : '') + '<div class="row"><button class="btn wide" data-close>Done</button></div>');
    $('#cin').focus();
    $('#cgo').onclick = function () {
      var c = $('#cin').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (c.length !== 6) { $('#cmsg').textContent = 'The code has 6 letters and numbers.'; return; }
      $('#cmsg').textContent = 'Connecting…';

        if (!n) { $('#cmsg').textContent = 'Could not reach the live service. Check your connection and try again.'; return; }

        var t0 = Date.now(), iv = setInterval(function () { if (sess.screens() > 0) { clearInterval(iv); $('#sh').hidden = true; toast('Screen connected'); } else if (Date.now() - t0 > 12000) { clearInterval(iv); $('#cmsg').textContent = 'No screen answered. Check the code on the TV and try again.'; } }, 500);
      });
    };
    $('#cin').onkeydown = function (e) { if (e.key === 'Enter') $('#cgo').onclick(); };
    $('#ccopy').onclick = function () { copy(screenURL()); };
    if ($('#caud')) $('#caud').onclick = function () { window.open(screenURL(), 'scwp-audience', 'popup,width=1280,height=720'); $('#sh').hidden = true; };
  };
  function copy(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('Link copied'); }).catch(function () { prompt('Copy this link', t); }); }
  $('#bShare').onclick = function () {
    var u = remoteURL(), q = qrcode(0, 'M'); q.addData(u); q.make();
    sheet('<h3 class="serif">Let someone help</h3><p>Send this link. They see the song you are on, can move the lyrics and pick any song from your songbook. No app or account needed. It works until you end this worship time.</p>' + (lead ? '<label class="tog"><span><b>Let others move the lyrics</b><small>Turn off and everyone else just follows you</small></span><input type="checkbox" id="slock"' + (state && state.lock ? '' : ' checked') + '></label><div class="who" id="swho"></div>' : '') + '<div class="qr">' + q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) + '</div><div class="url">' + esc(u) + '</div><div class="row">' + (navigator.share ? '<button class="btn pri" id="sshare">Share…</button>' : '') + '<button class="btn" id="scopy">Copy link</button><button class="btn" data-close>Done</button></div>');
    if ($('#sshare')) $('#sshare').onclick = function () { navigator.share({ title: 'Worship remote', url: u }).catch(function () {}); };

  };

  }

  function askName() {
    sheet('<h3 class="serif">Joining worship</h3><p>Your first name, so others can see who moved the lyrics.</p><input class="srch" id="nm" autocomplete="given-name" maxlength="30" placeholder="Your name"><div class="row"><button class="btn pri wide" id="nmok">Join</button></div>');

  };
  $('#pill').onclick = function () { pill(); toast(st.relays ? (st.screens ? 'Live: the screen is following along' : 'Live. Connect a screen with the TV button') : 'No connection. Your taps will send when it is back'); };
  addEventListener('keydown', function (e) {
