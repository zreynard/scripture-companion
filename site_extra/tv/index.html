<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1628"><title>Worship · Screen</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0f1628;--ink:#f6efe0;--dim:rgba(246,239,224,.55);--gold:#c9a24a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;cursor:default}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:radial-gradient(120% 90% at 50% 40%,#16213a 0%,#0f1628 60%,#0b1120 100%)}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:7vh 6vw}
.slide{position:absolute;inset:7vh 6vw;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .35s ease}
.slide.on{opacity:1}
.slide .tx{line-height:1.32;letter-spacing:.005em;text-wrap:balance;max-width:100%}
.slide .tx div{margin:0 0 .12em}
.slide .tx .gap{height:.55em}
#pair[hidden]{display:none}
#pair{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2vh;text-align:center;padding:6vh}
#pair h1{margin:0;font-weight:400;font-size:6vh;color:var(--ink)}
#pair .code{font:600 15vh/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;color:var(--gold);margin:1vh 0}
#pair p{margin:0;font-size:2.7vh;line-height:1.45;color:var(--dim);max-width:60vw}
#pair p b{color:var(--ink);font-weight:600}
#hint{position:fixed;left:50%;bottom:3vh;transform:translateX(-50%);font-size:1.9vh;color:var(--dim);background:rgba(255,255,255,.06);padding:.8vh 1.6vh;border-radius:2vh;transition:opacity .6s;pointer-events:none}
#dot{position:fixed;right:1.6vh;bottom:1.6vh;width:1vh;height:1vh;border-radius:50%;background:#c46a4a;opacity:0;transition:opacity .6s}
#dot.show{opacity:.7}
#old{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:8vh;font-size:3.4vh;line-height:1.5;color:var(--ink)}
</style></head>
<body>
<div id="stage"></div>
<div id="pair" hidden><h1 class="serif">Worship</h1><div class="code" id="code">······</div>
<p>On your phone, open <b>Worship</b>, start <b>Present</b>, tap <b>Connect a screen</b>, and enter this code.</p><p id="pst">Connecting…</p></div>
<div id="hint" style="opacity:0"></div><div id="dot" title="Reconnecting"></div>
<div id="old">This TV's web browser is too old to show live lyrics.<br>Connect a laptop to the TV with HDMI and open this page there instead.</div>
<script src="../live.js"></script>
<script>
/* The screen: lyrics only. It joins a session from its link (#s=..&k=..) or by showing a pairing code.
   It keeps the last lyrics on screen through any outage, and its own keys work with no internet:
   → / Space / PageDown next · ← / PageUp back · B blank · 1–9 a section · [ ] songs · F full screen */
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  if (!window.WebSocket || !window.crypto || !crypto.subtle || !window.TextEncoder || !window.Promise) { $('#old').style.display = 'flex'; return; }
  var SKEY = 'scwp:screen', sess = null, deck = null, state = null, shown = '', lp = null, wake = null, downSince = 0;
  function hp() { var o = {}; location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) o[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); }); return o; }
  function hint(t, ms) { var h = $('#hint'); h.textContent = t; h.style.opacity = 1; clearTimeout(hint.t); hint.t = setTimeout(function () { h.style.opacity = 0; }, ms || 4000); }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function cur() { if (!deck || !state) return null; var sg = deck.songs[state.song || 0]; return sg ? { song: sg, slide: sg.slides[state.slide || 0] } : null; }
  /* biggest text that fits: start large, shrink only as far as needed */
  function fit(el) {
    var tx = el.querySelector('.tx'), box = el.getBoundingClientRect(), hi = Math.min(innerHeight * 0.115, innerWidth * 0.072), lo = innerHeight * 0.035, sz = hi;
    tx.style.fontSize = sz + 'px';
    for (var i = 0; i < 40 && (tx.scrollHeight > box.height || tx.scrollWidth > box.width) && sz > lo; i++) { sz *= 0.95; tx.style.fontSize = sz + 'px'; }
  }
  function paint(force) {
    var c = cur(), key = !state ? 'none' : state.blank || state.ended ? 'blank' : c && c.slide ? (state.song + ':' + state.slide + ':' + (deck.dv || 0)) : 'none';
    if (key === shown && !force) return; shown = key;
    var st = $('#stage'), olds = Array.prototype.slice.call(st.querySelectorAll('.slide'));
    var el = document.createElement('div'); el.className = 'slide';
    if (key !== 'blank' && key !== 'none') el.innerHTML = '<div class="tx serif">' + c.slide.l.map(function (l) { return l ? '<div>' + esc(l) + '</div>' : '<div class="gap"></div>'; }).join('') + '</div>';
    st.appendChild(el); if (el.firstChild) fit(el);
    olds.forEach(function (o) { o.classList.remove('on'); setTimeout(function () { if (o.parentNode) o.parentNode.removeChild(o); }, 450); });
    setTimeout(function () { if (el.parentNode) el.classList.add('on'); }, 20);
  }
  function join(info) {
    if (lp) { lp.stop(); lp = null; }
    try { localStorage.setItem(SKEY, JSON.stringify({ sid: info.sid, key: info.key, at: Date.now() })); } catch (e) {}
    $('#pair').hidden = true;
    sess = new Live.Session({ sid: info.sid, key: info.key, role: 'screen',
      onState: function (s) { state = s; if (s.ended) { paint(); setTimeout(endScreen, 4000); return; } paint(); },
      onDeck: function (d) { deck = d; paint(true); },
      onDeckCleared: function () {},
      onStatus: function (st) {
        if (st.relays) { downSince = 0; $('#dot').classList.remove('show'); if (!join.said) { join.said = 1; hint('Connected · press F for full screen', 5000); } }
        else { if (!downSince) downSince = Date.now(); if (Date.now() - downSince > 8000) $('#dot').classList.add('show'); }
      } });
    keepAwake();
  }
  function endScreen() { if (sess) { sess.close(); sess = null; } try { localStorage.removeItem(SKEY); } catch (e) {} deck = state = null; shown = ''; $('#stage').innerHTML = ''; history.replaceState(null, '', location.pathname); pairMode(); }
  function pairMode() {
    var c = Live.code(6); $('#code').textContent = c; $('#pair').hidden = false; $('#pst').textContent = 'Connecting…';
    lp = Live.listenPair(c, function (m) { join(m); }, function (n) { $('#pst').textContent = n ? 'Ready. Waiting for your phone…' : 'Connecting…'; });
    setTimeout(function () { if (lp && !sess) { lp.stop(); pairMode(); } }, 30 * 60 * 1000);   // a fresh code every half hour
  }
  function keepAwake() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {}); } catch (e) {} }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && sess) keepAwake(); });
  /* keys and clicker work here even with no internet */
  function go(d) {
    if (!sess || !deck || !state) return; var s = state.song || 0, i = (state.slide || 0) + d, sg = deck.songs[s];
    if (i >= sg.slides.length) { if (s + 1 < deck.songs.length) { s++; i = 0; } else return; }
    if (i < 0) { if (s > 0) { s--; i = deck.songs[s].slides.length - 1; } else return; }
    sess.set({ song: s, slide: i, blank: false });
  }
  function jumpSec(n) { var sg = deck && state && deck.songs[state.song || 0]; if (!sg) return; var seen = [], idx = -1; sg.slides.forEach(function (x, i) { var k = x.sec; if (seen.indexOf(k) < 0) { seen.push(k); if (seen.length === n) idx = i; } }); if (idx >= 0) sess.set({ slide: idx, blank: false }); }
  function song(d) { if (!deck || !state) return; var s = (state.song || 0) + d; if (s >= 0 && s < deck.songs.length) sess.set({ song: s, slide: 0, blank: false }); }
  addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'f' || k === 'F') { var d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(function () {}); else if (document.exitFullscreen) document.exitFullscreen(); return; }
    if (!sess) return;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'ArrowDown' || k === 'Enter') { e.preventDefault(); go(1); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp' || k === 'Backspace') { e.preventDefault(); go(-1); }
    else if (k === 'b' || k === 'B' || k === '.') sess.set({ blank: !(state && state.blank) });
    else if (/^[1-9]$/.test(k)) jumpSec(+k);
    else if (k === ']') song(1); else if (k === '[') song(-1);
  });
  addEventListener('dblclick', function () { var d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(function () {}); });
  addEventListener('resize', function () { paint(true); });
  var h = hp(), saved = null; try { saved = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) {}
  if (h.s && h.k) join({ sid: h.s, key: h.k });
  else if (saved && Date.now() - saved.at < 12 * 3600e3) join(saved);
  else pairMode();
})();
</script>
</body></html>
